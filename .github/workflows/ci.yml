name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # OpenCV needs libGL/glib; MediaPipe loads the EGL/GLES runtime at start-up.
      - name: Install system libraries for OpenCV and MediaPipe
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libegl1 libgles2

      # constraints.txt pins the versions tested on Python 3.12 (some, e.g. numpy 2.5,
      # need 3.12+), so other versions get the newest releases that support them.
      - name: Install package
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pip install -c constraints.txt -e ".[dev]"
          else
            pip install -e ".[dev]"
          fi

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Test
        run: pytest --cov=drowsiness --cov-report=term-missing
