# Default configuration. Every value here matches the built-in default, so
# copy this file and change only what you need:
#   drowsiness run --config configs/my_settings.toml
# Relative paths are resolved from the project root.

[camera]
index = 0
width = 640
height = 480
mirror = true                       # selfie view for live cameras

[landmarker]
model_path = "models/face_landmarker.task"
max_faces = 2                       # the largest face is tracked as the driver
min_detection_confidence = 0.5
min_presence_confidence = 0.5
min_tracking_confidence = 0.5

[calibration]
enabled = true
duration_s = 5.0                    # look ahead with eyes open for this long
min_samples = 30
ear_closed_ratio = 0.60             # closed = EAR below 60% of the open-eye EAR
                                    # (0.75 also flagged smiles, squints, looking down)
min_ear_threshold = 0.12
max_ear_threshold = 0.30
# A baseline outside these limits is rejected and calibration restarts;
# after max_attempts the default thresholds are used, with a visible warning.
min_open_ear = 0.20                 # lower = eyes were probably closed/drowsy
max_open_ear = 0.45
max_neutral_pitch_deg = 25.0        # larger = driver was looking down/up
max_attempts = 3

[indicators]
default_ear_threshold = 0.21        # used when calibration is off or fails
perclos_window_s = 20.0
perclos_max = 0.4                   # PERCLOS mapped to an eye score of 1
microsleep_s = 1.5                  # continuous closure mapped to an eye score of 1
closure_debounce_s = 0.15           # eyes must stay open this long to end a closure
yawn_mar_threshold = 0.5
yawn_min_duration_s = 1.5
yawn_window_s = 60.0
yawns_for_max = 3                   # yawns within the window for a yawn score of 1
yawn_debounce_s = 0.20              # mouth must close this long to end a yawn
head_pitch_threshold_deg = 15.0     # forward nod, relative to the calibrated pose
head_roll_threshold_deg = 20.0      # sideways tilt, relative to the calibrated pose
head_tilt_max_s = 2.0               # tilt duration mapped to a head score of 1
head_debounce_s = 0.20              # head must stay upright this long to end a tilt
face_loss_grace_s = 0.30            # shorter face dropouts keep indicator state;
                                    # longer ones clear closure/yawn/tilt timers

[conditions]
# Low light: cameras brighten dark scenes, so the whole frame's brightness
# (0-255) is used, not the face's. Tuned on real night vs day footage with
# tools/tune_conditions.py.
low_light_brightness = 76.0         # whole-frame brightness below this: low light...
low_light_margin = 8.0              # ...until it is this far above it again
# Eye-region occlusion (eyes cannot be seen): a frame counts as occluded if
# any check fires. Tuned to flag at most 3% of uncovered-eye frames in every
# dataset; lightly tinted sunglasses are deliberately not flagged.
glare_level = 245                   # grey level counted as glare
glare_fraction = 0.15               # glare on this share of an eye region
min_eye_contrast_ratio = 0.10       # eye region this flat vs the face: covered
max_ear_asymmetry = 0.5             # one eye reads this differently: one eye hidden
asymmetry_max_yaw_deg = 25.0        # (asymmetry checked only when facing ahead...
asymmetry_min_open_ear = 0.20       # ...and at least one eye is clearly open)
occlusion_enter = 0.6               # share of recent frames occluded to start...
occlusion_exit = 0.3                # ...and to end the condition
smoothing_s = 1.0                   # time constant of the moving averages
microsleep_needs_visible_eyes = false  # true: with eyes occluded a microsleep no
                                       # longer forces an alarm on its own (fewer
                                       # glare false alarms, but a real microsleep
                                       # behind glare would then raise no alert)

[fusion]
strategy = "adaptive"               # "adaptive" or "static" (fixed weights, baseline)
# Normal conditions (also the static baseline)
eye_weight = 0.5
yawn_weight = 0.2
head_weight = 0.3
# Low light: the eye cue gets noisy, so trust mouth and head more
low_light_eye_weight = 0.2
low_light_yawn_weight = 0.35
low_light_head_weight = 0.45
# Eye region occluded (glare, dark glasses, hand)
occluded_eye_weight = 0.2
occluded_yawn_weight = 0.35
occluded_head_weight = 0.45
transition_s = 1.0                  # weights move to new values over this long

[alerts]
level1_threshold = 0.25             # on-screen warning
level2_threshold = 0.45             # audio alarm
level3_threshold = 0.65             # critical, persistent
hysteresis = 0.05
escalate_after_s = 5.0              # alarm held this long escalates to critical
level2_hold_s = 1.5                 # an alarm sounds at least this long (no stutter)
level3_hold_s = 5.0
microsleep_alarm = true             # a microsleep always raises at least level 2
no_face_warning_s = 3.0             # face lost: head slumped out of view, camera blocked...
no_face_alarm_s = 6.0
no_face_critical_s = 10.0
sound_enabled = true
sound_path = "assets/alarm.wav"
log_dir = "logs"
