[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drowsiness-detection"
version = "0.4.0"
description = "Real-time driver drowsiness detection with condition-aware adaptive signal fusion"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Yagnang Acharya" },
    { name = "Akash Minz" },
]
dependencies = [
    "mediapipe>=0.10.14",
    "numpy>=1.26",
    "opencv-contrib-python>=4.9",
    "pandas>=2.0",
    "pygame>=2.5",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
drowsiness = "drowsiness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drowsiness = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
